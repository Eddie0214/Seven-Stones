services:
  app:
    build: .
    image: seven-stones:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /app/data/league.sqlite
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - seven-stones-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8787/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  seven-stones-data:
